titulo: Manual de usuario
subtitulo: Sistema de Inventario
cliente: Distribuidora (demo)
version: "0.1"
autor: Rod
archivo: manual-demo
base_url: ${DEMO_URL}
viewport: {width: 1280, height: 720}
login:
  url: /login.html
  acciones:
    - fill: {selector: "#id_username", valor: "${MANUAL_USER}"}
    - fill: {selector: "#id_password", valor: "${MANUAL_PASS}"}
    - click: "button[type=submit]"
  esperar: "nav"
ocultar: ["#usuario-email"]
introduccion: |
  Este manual explica cómo usar el sistema de inventario.

  Cada sección describe una tarea completa, paso a paso.
secciones:
  - id: registrar-entrada
    titulo: Registrar una entrada de mercancía
    intro: Úsalo cada vez que llegue mercancía de un proveedor.
    pasos:
      - texto: Al entrar verás la pantalla de **Inicio**. En el menú lateral, da clic en **Inventario**.
        captura:
          resaltar: ["#menu-inventario"]
      - acciones: [{click: "#menu-inventario"}]
        texto: Verás la lista de productos con su existencia. Da clic en **Nueva entrada**.
        captura:
          resaltar: ["text=Nueva entrada"]
      - acciones:
          - click: "text=Nueva entrada"
          - esperar: "form#entrada"
          - select: {selector: "#id_producto", valor: "Arroz 1kg"}
          - fill: {selector: "#id_cantidad", valor: "48"}
        texto: Elige el producto ① y escribe la cantidad ②.
        captura:
          resaltar: ["#id_producto", "#id_cantidad"]
          recortar: {selector: "form#entrada", margen: 4}
          ancho: 4.5
        importante: La cantidad se captura en **piezas**, no en cajas.
      - acciones:
          - click: "text=Guardar"
          - esperar: ".alert-success"
        texto: Da clic en **Guardar**. Verás un mensaje de confirmación en verde.
        captura:
          resaltar: [{selector: ".alert-success", etiqueta: false}]
        nota: La existencia se actualiza de inmediato.
    problemas:
      - "Si no encuentras el producto en la lista, primero dalo de alta en **Catálogo**."
